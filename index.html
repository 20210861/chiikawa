<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e3">
  <title>한 잔 준비했대…</title>
  <meta name="description" content="꾹 눌러서 끝까지 마시게 해 줘">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="한 잔 준비했대…">
  <meta property="og:description" content="꾹 눌러서 끝까지 마시게 해 줘">
  <!-- 카톡·SNS 미리보기 썸네일: Tenor에 올라가 있는 이미지를 링크로 연결해요 -->
  <meta property="og:image" content="https://media1.tenor.com/m/q-fD04tuxz4AAAAC/chiikawa-kurimanju.gif">
  <meta property="og:image:secure_url" content="https://media1.tenor.com/m/q-fD04tuxz4AAAAC/chiikawa-kurimanju.gif">
  <meta property="og:image:type" content="image/gif">
  <meta property="og:image:width" content="498">
  <meta property="og:image:height" content="498">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://media1.tenor.com/m/q-fD04tuxz4AAAAC/chiikawa-kurimanju.gif">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" data-mode="receive" data-state="idle">
    <header class="intro">
      <p class="eyebrow" id="fromLine"></p>
      <h1 id="title">한 잔<br>준비했대<span class="dots">…</span></h1>
    </header>

    <div class="stage" id="stage">
      <div class="glow" aria-hidden="true"></div>

      <div class="actor" id="actor" data-pose="idle">
        <span class="frame-label" id="frameLabel" hidden></span>
        <img class="actor-img" id="actorImg" alt="" draggable="false" hidden>
        <div class="actor-clips" id="actorClips"></div>
        <span class="frame-flush" aria-hidden="true"></span>
        <!-- 기본 캐릭터(오리지널 '보리'). assets/character/ 에 이미지를 넣으면 자동으로 대체돼요 -->
        <svg class="actor-svg" id="actorSvg" viewBox="0 0 200 200" aria-hidden="true">
          <g class="sprout" fill="#e8b649" stroke="#7a5418" stroke-width="2">
            <path d="M100 52 C100 38 101 26 104 14" fill="none" stroke-width="3"/>
            <ellipse cx="104" cy="12" rx="5" ry="8"/>
            <ellipse cx="96" cy="22" rx="4.5" ry="7.5" transform="rotate(-35 96 22)"/>
            <ellipse cx="111" cy="24" rx="4.5" ry="7.5" transform="rotate(35 111 24)"/>
            <ellipse cx="95" cy="35" rx="4.5" ry="7.5" transform="rotate(-35 95 35)"/>
            <ellipse cx="110" cy="37" rx="4.5" ry="7.5" transform="rotate(35 110 37)"/>
          </g>
          <ellipse class="arm arm-l" cx="30" cy="140" rx="14" ry="11" fill="#fff3d6" stroke="#5a3e1b" stroke-width="4"/>
          <path class="body" d="M100 50 C155 50 182 92 182 130 C182 168 148 188 100 188 C52 188 18 168 18 130 C18 92 45 50 100 50 Z" fill="#fff3d6" stroke="#5a3e1b" stroke-width="4"/>
          <ellipse class="arm arm-r" cx="168" cy="146" rx="14" ry="11" fill="#fff3d6" stroke="#5a3e1b" stroke-width="4"/>
          <g class="blush" fill="#ff9aa8">
            <ellipse cx="56" cy="132" rx="14" ry="8"/>
            <ellipse cx="144" cy="132" rx="14" ry="8"/>
          </g>
          <g class="eyes eyes-open" fill="#3a2610">
            <ellipse cx="72" cy="112" rx="6" ry="7.5"/>
            <ellipse cx="128" cy="112" rx="6" ry="7.5"/>
            <circle cx="74" cy="109" r="2" fill="#fff"/>
            <circle cx="130" cy="109" r="2" fill="#fff"/>
          </g>
          <g class="eyes eyes-closed" fill="none" stroke="#3a2610" stroke-width="4" stroke-linecap="round">
            <path d="M62 112 Q72 120 82 112"/>
            <path d="M118 112 Q128 120 138 112"/>
          </g>
          <g class="eyes eyes-happy" fill="none" stroke="#3a2610" stroke-width="4" stroke-linecap="round">
            <path d="M62 116 Q72 102 82 116"/>
            <path d="M118 116 Q128 102 138 116"/>
          </g>
          <g class="mouth mouth-idle" fill="none" stroke="#3a2610" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M90 130 Q95 136 100 130 Q105 136 110 130"/>
          </g>
          <g class="mouth mouth-drink">
            <ellipse cx="100" cy="134" rx="7" ry="8" fill="#7a3a22" stroke="#3a2610" stroke-width="3"/>
          </g>
          <g class="mouth mouth-finish">
            <path d="M82 128 Q100 156 118 128 Z" fill="#7a3a22" stroke="#3a2610" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M90 140 Q100 147 110 140" fill="#ff8a8a"/>
          </g>
          <g class="foam-mustache" fill="#fffef8" stroke="#e9d9b5" stroke-width="1.5">
            <circle cx="84" cy="126" r="7"/><circle cx="94" cy="123" r="8"/><circle cx="106" cy="123" r="8"/><circle cx="116" cy="126" r="7"/>
          </g>
        </svg>
      </div>

      <div class="mug" id="mug" aria-hidden="true">
        <svg viewBox="0 0 110 130">
          <defs>
            <clipPath id="glassClip"><rect x="12" y="22" width="66" height="96" rx="10"/></clipPath>
            <linearGradient id="beerGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#ffd34d"/>
              <stop offset="1" stop-color="#f0951a"/>
            </linearGradient>
          </defs>
          <path d="M76 42 h10 a15 15 0 0 1 15 15 v26 a15 15 0 0 1 -15 15 h-10" fill="none" stroke="#5a3e1b" stroke-width="12" stroke-linecap="round"/>
          <path d="M76 42 h10 a15 15 0 0 1 15 15 v26 a15 15 0 0 1 -15 15 h-10" fill="none" stroke="#fdf3df" stroke-width="5" stroke-linecap="round"/>
          <g clip-path="url(#glassClip)">
            <rect x="12" y="22" width="66" height="96" fill="#fdf8ee"/>
            <rect id="beer" x="12" y="30" width="66" height="88" fill="url(#beerGrad)"/>
            <g id="beerBubbles" fill="#fff6c9">
              <circle class="b b1" cx="26" cy="112" r="2.4"/>
              <circle class="b b2" cx="42" cy="114" r="1.8"/>
              <circle class="b b3" cx="58" cy="112" r="2.6"/>
              <circle class="b b4" cx="68" cy="115" r="1.6"/>
              <circle class="b b5" cx="34" cy="115" r="2"/>
            </g>
            <g id="foam" fill="#fffef8" stroke="#ecdcb8" stroke-width="1.2">
              <rect x="10" y="-2" width="70" height="10"/>
              <circle cx="16" cy="-2" r="8"/><circle cx="29" cy="-5" r="9"/><circle cx="44" cy="-3" r="8"/>
              <circle cx="58" cy="-6" r="9"/><circle cx="72" cy="-2" r="8"/>
            </g>
          </g>
          <rect x="12" y="22" width="66" height="96" rx="10" fill="none" stroke="#5a3e1b" stroke-width="4"/>
          <path d="M24 36 v62" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
        </svg>
      </div>

      <small class="clip-credit" id="clipCredit" hidden></small>
      <div class="fx" id="fx" aria-hidden="true"></div>
      <div class="flash" aria-hidden="true"></div>
      <span class="slam-word" aria-hidden="true">탕!</span>
      <div class="big-word" id="bigWord" aria-hidden="true">프하~~!!</div>
      <div class="burp" id="burp" aria-hidden="true"><span>끄억</span></div>

      <article class="message-card" id="messageCard" aria-live="polite">
        <p class="message-text" id="messageText"></p>
        <p class="message-from" id="messageFrom"></p>
      </article>
    </div>

    <p class="caption" id="caption">시원한 맥주가 앞에 있다…</p>

    <!-- 받는 사람 화면 -->
    <section class="controls" id="controls" aria-label="마시게 하기">
      <div class="meter-meta"><span>남은 맥주</span><span><strong id="percent">100</strong>%</span></div>
      <div class="meter" role="progressbar" aria-label="남은 맥주" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="meter">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <button class="hold-button" id="holdButton" type="button">🍺 꾹 눌러서 마시게 하기</button>
      <div class="after-actions" id="afterActions" hidden>
        <button class="action-button" id="replayButton" type="button">한 잔 더…!</button>
        <button class="outline-button" id="makeOwnButton" type="button">나도 한 잔 보내기</button>
      </div>
      <button class="text-button" id="previewBackButton" type="button" hidden>편집으로 돌아가기</button>
    </section>

    <!-- 보내는 사람 화면 -->
    <form class="composer" id="composer" autocomplete="off" hidden>
      <div class="field-heading"><label for="messageInput">다 마시면 튀어나올 말</label><span id="messageCount">0 / 80</span></div>
      <textarea id="messageInput" rows="4" maxlength="200" placeholder="오늘도 고생 많았어! 짠🍻" required></textarea>
      <div class="field-heading"><label for="fromInput">보내는 사람 <small>(선택)</small></label></div>
      <input id="fromInput" type="text" maxlength="12" placeholder="이름이나 별명">
      <p class="form-error" id="formError" role="alert" hidden></p>
      <button class="action-button" type="submit">🍺 링크 만들기</button>
    </form>

    <section class="link-panel" id="linkPanel" hidden>
      <p class="link-help">이 링크에 한 잔 담았어!</p>
      <input id="generatedLink" class="link-input" readonly type="text" spellcheck="false" aria-label="공유할 링크">
      <div class="link-actions">
        <button class="action-button" id="shareButton" type="button">공유하기</button>
        <button class="outline-button" id="copyButton" type="button">링크 복사</button>
      </div>
      <p class="link-status" id="linkStatus" role="status" aria-live="polite"></p>
      <div class="secondary-actions">
        <button class="text-button" id="previewButton" type="button">미리 보기</button>
        <button class="text-button" id="editButton" type="button">문구 수정</button>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
